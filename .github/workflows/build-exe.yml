name: build-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（仅手动构建时用于产物命名）"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview

      - name: Smoke import
        run: |
          python -c "import signstudio, desktop, version; print('version', version.VERSION)"

      - name: Check update sources are real
        run: |
          python -c "import version; m=version.DEFAULT_MANIFESTS; print('\n'.join(m)); assert not any('example.com' in u or 'nas.local' in u for u in m), '更新源仍是占位地址，exe 会连不上'"

      - name: Build exe (windowed, embedded studio.html + assets)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name SignStudio `
            --add-data "studio.html;." `
            --add-data "assets;assets" `
            --collect-all pymupdf `
            --collect-all pikepdf `
            --collect-all pyhanko `
            --collect-all pyhanko_certvalidator `
            --collect-all certvalidator `
            --collect-all uharfbuzz `
            --collect-all fontTools `
            --collect-all webview `
            --hidden-import tzlocal `
            --hidden-import asn1crypto `
            desktop.py

      - name: Verify exe exists
        run: |
          if (!(Test-Path dist/SignStudio.exe)) { throw "exe 未生成" }
          Get-Item dist/SignStudio.exe | Format-List Name,Length
          (Get-FileHash dist/SignStudio.exe -Algorithm SHA256).Hash |
            Out-File -Encoding ascii dist/SignStudio.exe.sha256

      - name: Smoke test (exe 静默启动 + 局域网监听)
        run: |
          $p = Start-Process -FilePath "dist/SignStudio.exe" -ArgumentList "--no-window","--port","8899" -PassThru
          $h = $null
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try {
              $h = Invoke-RestMethod "http://127.0.0.1:8899/api/health" -TimeoutSec 3
              if ($h.ok) { break }
            } catch { }
          }
          if (-not $h -or -not $h.ok) {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "exe 启动后 /api/health 不通（可能缺少依赖或窗口模式异常）"
          }
          Write-Host ("host={0} version={1} lan={2}" -f $h.host, $h.version, ($h.lan -join ","))
          if ($h.host -ne "0.0.0.0") {
            Stop-Process -Id $p.Id -Force
            throw "exe 没有监听 0.0.0.0，局域网无法访问"
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "smoke ok"

      - name: Self-update mechanism test (rename running exe)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "sstest"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist/SignStudio.exe "$dir/t.exe"
          $p = Start-Process -FilePath "$dir/t.exe" -ArgumentList "--no-window","--port","8897" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $h = Invoke-RestMethod "http://127.0.0.1:8897/api/health" -TimeoutSec 3; if ($h.ok) { $ok = $true; break } } catch { }
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "测试实例没起来" }
          try {
            Rename-Item "$dir/t.exe" "t.exe.old" -ErrorAction Stop
            Write-Host "rename running exe: ok"
          } catch {
            Stop-Process -Id $p.Id -Force
            throw "Windows 不允许改名运行中的 exe，自更新方案需要改回 helper 方案：$_"
          }
          Copy-Item dist/SignStudio.exe "$dir/t.exe"
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          $p2 = Start-Process -FilePath "$dir/t.exe" -ArgumentList "--no-window","--port","8896" -PassThru
          $ok2 = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $h2 = Invoke-RestMethod "http://127.0.0.1:8896/api/health" -TimeoutSec 3; if ($h2.ok) { $ok2 = $true; break } } catch { }
          }
          if (-not $p2.HasExited) { Stop-Process -Id $p2.Id -Force }
          if (-not $ok2) { throw "替换后的 exe 起不来" }
          Write-Host ("self-update swap ok, version=" + $h2.version)

      - name: Package (exe + 使用说明)
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item dist/SignStudio.exe pkg/
          @"
          SignStudio v${{ github.ref_name }} 打包版

          1. 双击 SignStudio.exe：后台起服务并弹出工作台窗口（无控制台窗口）。
          2. 局域网其他电脑用浏览器打开窗口里显示的 http://本机IP:8765/ 即可使用；
             Windows 首次启动若弹防火墙，请勾选「专用网络」并允许。
          3. 首次运行会在 exe 旁边创建 projects/、shared/、.studio_tmp/、logs/，
             工程与签名都保存在这台电脑上；换目录时把这些文件夹一起带走即可。
          4. 关闭窗口即退出程序。
          "@ | Out-File -Encoding utf8 pkg/使用说明.txt
          Copy-Item dist/SignStudio.exe.sha256 pkg/
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path pkg/* -DestinationPath "SignStudio-win64-$tag.zip" -Force
          Get-ChildItem *.zip, dist/SignStudio.exe | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignStudio-windows
          path: |
            dist/SignStudio.exe
            SignStudio-win64-*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SignStudio.exe
            SignStudio-win64-*.zip
            dist/SignStudio.exe.sha256
          generate_release_notes: true
